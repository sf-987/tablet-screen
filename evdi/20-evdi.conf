# /etc/X11/xorg.conf.d/20-evdi.conf
# Bind the modesetting driver (no acceleration) to evdi virtual-display devices so X
# adds them as GPU screens; NVIDIA then acts as PRIME output source for them.
# Applies only to devices driven by the evdi kernel module; harmless otherwise.
Section "OutputClass"
    Identifier   "evdi"
    MatchDriver  "evdi"
    Driver       "modesetting"
    Option       "AccelMethod" "none"
EndSection
